name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-test:
    name: Build and Test (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B package

      - name: Save jar for the next stage
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  docker-build-push:
    name: Build and Push Docker Image
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download jar from build stage
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/maven-demo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/maven-demo:${{ github.sha }}

  deploy:
    name: Deploy (pull and run the image)
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull the published image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/maven-demo:latest

      - name: Run the container
        run: docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/maven-demo:latest
